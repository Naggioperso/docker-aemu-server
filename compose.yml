# Shared conf between x86 and ARM
x-aemu-common: &aemu-common
  build:
    context: ./conf.d/aemu_postoffice/
    dockerfile: Dockerfile.${ARCH:-x86_64}
  image: aemu_postoffice:${ARCH:-x86_64}
  restart: unless-stopped
  container_name: aemu_postoffice
  command: [ "/app/aemu_postoffice" ]
  networks:
    aemu_network:
      ipv4_address: 172.20.0.11
  ports:
    - "27312:27312/udp"
    - "27312:27312/tcp"
    - "27313:27313/udp"
    - "27313:27313/tcp"
    - "8888:8888/tcp"

services:
  # Specific for x86
  aemu_postoffice_x86:
    <<: *aemu-common
    profiles: [ "x86_64" ]
    volumes:
      - ./server_cpp/http_assets:/app/http_assets
      - ./server_cpp/aemu_postoffice:/app/aemu_postoffice
      - ./server_cpp/config.json:/app/config.json
      - ./server_cpp/game_db.json:/app/game_db.json

  # Specific for ARM. Executable compiled in the image
  aemu_postoffice_arm:
    <<: *aemu-common
    profiles: [ "aarch64" ]
    volumes:
      - ./server_cpp/http_assets:/app/http_assets
      - ./server_cpp/config.json:/app/config.json
      - ./server_cpp/game_db.json:/app/game_db.json
  #
  # # If you need a proxy, decomment the following and change it accordin to your need
  # proxy:
  #   image: nginx:latest
  #   restart: unless-stopped
  #   container_name: proxy
  #   volumes:
  #     - conf:conf # path to the config. Add 2 more for the cert and the key if you use https
  #   networks:
  #     aemu_network:
  #       ipv4_address: 172.20.0.10
  #   ports:
  #     - "443:443" # change according to your need

networks:
  aemu_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1
